name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build:
    name: Build & Test (Windows 11 / Server 2022)
    runs-on: windows-latest
    env:
      CGO_ENABLED: 1

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: Verify Go & C Compiler
        run: |
          go version
          gcc --version

      - name: Run Tests
        run: |
          go test -v ./...

      - name: Build Binary
        run: |
          go build -v -o bin/v2c.exe ./cmd/v2c
